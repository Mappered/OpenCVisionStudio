# Prove that the MinGW-w64 toolchain builds and links Media Foundation code.
#
# Media Foundation is normally consumed with MSVC and the Windows SDK. This
# project is MinGW-only by decision, so before writing a webcam backend we find
# out whether that is even possible: the probe compiles, links, initialises MF,
# enumerates video devices, and queries the camera-control interfaces that
# set_framegrabber_param would need.
#
# A CI runner has no cameras, so zero devices is a pass. The value of the run is
# that the build and link succeed and the control-discovery code paths exist and
# are exercised up to the point where hardware is required. A developer with a
# webcam can build the same probe locally for the real answer.
#
# NO EXTERNAL ACTIONS: plain commands only, per repository policy.

name: Probe Media Foundation

on:
  workflow_dispatch:
  workflow_call:

permissions:
  # Needed to publish the test kit to the artifacts branch. The other workflows
  # that publish use the same token and permission.
  contents: write

env:
  PLATFORM_TAG: win-x64

jobs:
  probe:
    runs-on: windows-latest
    steps:
      # Only the recipe ref is needed: the probe source is part of this
      # repository, not of a vendored subtree.
      - name: Fetch build recipe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $token = '${{ github.token }}'
          $repo  = '${{ github.repository }}'
          git init --quiet .
          git remote add origin "https://x-access-token:$token@github.com/$repo.git"
          git fetch --quiet --depth 1 origin '${{ github.ref_name }}'
          git checkout --force --quiet FETCH_HEAD
          Write-Host "recipe commit $((git rev-parse HEAD).Trim())"

      - name: Locate MSYS2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($root in @("$env:RUNNER_TEMP\msys64", 'C:\msys64', 'D:\msys64')) {
            if (Test-Path (Join-Path $root 'usr\bin\bash.exe')) {
              Write-Host "using MSYS2 at $root"
              "MSYS2_ROOT=$root" >> $env:GITHUB_ENV
              exit 0
            }
          }
          throw 'MSYS2 not found on this image'

      - name: Build and run the probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bash = Join-Path $env:MSYS2_ROOT 'usr\bin\bash.exe'
          $root = ($PWD.Path -replace '\\', '/')
          & $bash -lc "bash '$root/build/mingw/ci-mf-probe.sh' '$root'"
          if ($LASTEXITCODE -ne 0) { throw "probe failed with exit code $LASTEXITCODE" }

      # The last step of this work cannot be proven on a CI runner: the frame
      # server on a Server SKU faults inside its own FrameServerMonitorClient
      # module. So publish the kit and let it be run on a Windows 11 client,
      # where a real camera device can be enumerated.
      - name: Publish the virtual camera test kit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $token = '${{ github.token }}'
          $repo  = '${{ github.repository }}'
          $dest  = 'vcam/0.1.0/${{ env.PLATFORM_TAG }}'
          $out   = Join-Path $PWD 'build\mf-probe'

          $checkout = Join-Path $env:RUNNER_TEMP 'artifacts-repo'
          if (Test-Path $checkout) { Remove-Item -LiteralPath $checkout -Recurse -Force }
          git clone --quiet --branch artifacts "https://x-access-token:$token@github.com/$repo.git" $checkout
          $dir = Join-Path $checkout ($dest -replace '/', '\')
          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          foreach ($file in @('vcamsource.dll', 'vcam-register.exe', 'vcam-read.exe')) {
            $from = Join-Path $out $file
            if (-not (Test-Path $from)) { throw "missing $file - the probe did not build it" }
            Copy-Item $from $dir -Force
          }
          Copy-Item (Join-Path $out 'vcamsource.dll.log') $dir -Force -ErrorAction SilentlyContinue

          $buildinfo = [ordered]@{
            package      = 'vcam'
            version      = '0.1.0'
            platform     = '${{ env.PLATFORM_TAG }}'
            modules      = 'IMFActivate media source, IMFMediaSourceEx, RGB32 640x480'
            toolchain    = 'x86_64-w64-mingw32, gcc 16.2.0 (see the probe run for exact versions)'
            built_utc    = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            source_commit= '${{ github.sha }}'
            source_ref   = '${{ github.ref_name }}'
            subtree_tree = 'n/a (this package is not built from a vendored subtree)'
            run_url      = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            dependencies = @{}
          }
          $buildinfo | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $dir 'BUILDINFO.json') -Encoding utf8

          $readme = @(
            'OpenCVisionStudio virtual camera - test kit',
            '==========================================',
            '',
            'What this is',
            '  A Windows 11 user-mode virtual camera. A media source (vcamsource.dll)',
            '  is registered under a CLSID; the virtual camera names that CLSID as its',
            '  source id, and Media Foundation activates it to pull frames. Frames are',
            '  generated synthetically for now; the Aravis frame bus replaces the',
            '  generator behind the same interfaces.',
            '',
            'How to run it (Windows 11, elevated command prompt)',
            '  1. vcam-register.exe register vcamsource.dll',
            '     Registers the media source under HKCU and HKLM. The frame server',
            '     reads HKLM, so elevation is required.',
            '  2. vcam-read.exe',
            '     Creates the virtual camera, starts it, enumerates Media Foundation',
            '     devices, reads one frame, then removes the camera again.',
            '  3. Open the Windows Camera app while vcam-read.exe is running and look',
            '     for "OpenCVisionStudio Virtual Camera".',
            '  4. vcam-register.exe unregister      (cleanup)',
            '',
            'Reading the result',
            '  * "IMFVirtualCamera::Start: 0x00000000" plus "VCAM_READ ... sample_bytes=16384"',
            '    means the whole path works: the camera was published and delivered a frame.',
            '  * The media source runs inside the frame server process, so it traces to',
            '    vcamsource.dll.log next to the DLL. That file names every call the frame',
            '    server makes into it.',
            '  * On a Windows Server SKU the frame server faults inside its own',
            '    FrameServerMonitorClient.dll before the camera comes up. That is a',
            '    platform gap, not a defect in this kit: run it on a Windows 11 client.'
          )
          $readme | Set-Content (Join-Path $dir 'README.txt') -Encoding utf8

          Push-Location $checkout
          try {
            git config user.name  'GitHub Actions'
            git config user.email 'actions@github.com'
            git add -A
            git diff --cached --quiet
            if ($LASTEXITCODE -eq 0) {
              Write-Host 'artifacts branch already up to date'
            } else {
              git commit --quiet -m "vcam 0.1.0 win-x64 test kit"
              git push --quiet origin HEAD:artifacts
              Write-Host "published the virtual camera test kit to $dest"
            }
          } finally {
            Pop-Location
          }

      - name: Summary
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value 'Media Foundation probe: MinGW build and link of MF code.'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ''
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value 'Zero devices is expected on a runner. Run build/mingw/mf-probe.exe on a machine with a webcam for the real answer, including per-control ranges.'
