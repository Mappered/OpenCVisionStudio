# Build the vendored OpenCV (core, then imgproc/imgcodecs) and publish a
# redistributable package to the `artifacts` branch, so consumers download
# prebuilt binaries instead of building OpenCV themselves.
#
# NO EXTERNAL ACTIONS. This repository only allows actions from repositories
# owned by Mappered, so every step is a plain shell command: checkout is `git`,
# publishing is `git`, and the toolchain and build system come from MSYS2.
#
# CMake appears inside the CI job only, installed by pacman with the rest of the
# toolchain. That is deliberate and agreed: OpenCV's build is a 10k line CMake
# system with CPU dispatch and codec detection, and reproducing it by hand would
# be both weeks of work and a permanent source of silently-slower libraries.
# No developer machine needs cmake.
#
# Source of truth : the `opencv/` subtree on external/OpenCV
# Build recipe    : build/mingw/ci-opencv.sh - pacman, cmake, ninja, gcc, package
# Output          : `artifacts` branch, opencv/<version>/win-x64/

name: Build OpenCV

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or tag carrying the opencv/ subtree
        type: string
        default: external/OpenCV
      modules:
        description: Comma separated module list for BUILD_LIST
        type: string
        default: core
      wasm:
        description: Also build the WASM package (separate ubuntu workflow)
        type: boolean
        default: true
      wasm_simd:
        description: Build the WASM package with SIMD
        type: boolean
        default: false
      publish:
        description: Publish the built package to the artifacts branch
        type: boolean
        default: true
  workflow_call:
    inputs:
      source_ref:
        description: Branch or tag carrying the opencv/ subtree
        type: string
        required: false
        default: external/OpenCV
      modules:
        description: Comma separated module list for BUILD_LIST
        type: string
        required: false
        default: core
      wasm:
        description: Also build the WASM package (separate ubuntu workflow)
        type: boolean
        required: false
        default: false
      wasm_simd:
        description: Build the WASM package with SIMD
        type: boolean
        required: false
        default: false
      publish:
        description: Publish the built package to the artifacts branch
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  PLATFORM_TAG: win-x64

jobs:
  build-and-publish:
    runs-on: windows-latest
    # OpenCV takes a while; raise the ceiling from the 6 hour default is not
    # needed, but a stuck run should not burn an hour either.
    timeout-minutes: 180
    steps:
      - name: Fetch opencv source and build recipe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $token     = '${{ github.token }}'
          $repo      = '${{ github.repository }}'
          $sourceRef = '${{ inputs.source_ref }}'
          $recipeRef = '${{ github.ref_name }}'

          git init --quiet .
          git remote add origin "https://x-access-token:$token@github.com/$repo.git"

          git fetch --quiet --depth 1 origin $sourceRef
          git checkout --force --quiet FETCH_HEAD
          $sourceCommit = (git rev-parse HEAD).Trim()
          $subtreeTree  = (git rev-parse 'HEAD:opencv').Trim()

          # The build recipe lives on the same ref as this workflow file, which
          # is not the ref holding the opencv subtree.
          git fetch --quiet --depth 1 origin $recipeRef
          $recipeCommit = (git rev-parse FETCH_HEAD).Trim()

          $ciScript = git show "${recipeCommit}:build/mingw/ci-opencv.sh"
          if (-not $ciScript) { throw 'build/mingw/ci-opencv.sh not found on the recipe ref' }

          New-Item -ItemType Directory -Force -Path 'build\mingw' | Out-Null
          [IO.File]::WriteAllText("$PWD\build\mingw\ci-opencv.sh", (($ciScript -join "`n") + "`n"))

          "BUILD_SOURCE_COMMIT=$sourceCommit" >> $env:GITHUB_ENV
          "BUILD_SOURCE_REF=$sourceRef"       >> $env:GITHUB_ENV
          "BUILD_SUBTREE_TREE=$subtreeTree"   >> $env:GITHUB_ENV
          Write-Host "opencv $sourceCommit ($sourceRef) subtree $subtreeTree, recipe $recipeCommit ($recipeRef)"

      - name: Locate MSYS2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($root in @("$env:RUNNER_TEMP\msys64", 'C:\msys64', 'D:\msys64')) {
            if (Test-Path (Join-Path $root 'usr\bin\bash.exe')) {
              Write-Host "using MSYS2 at $root"
              "MSYS2_ROOT=$root" >> $env:GITHUB_ENV
              exit 0
            }
          }
          Write-Host 'MSYS2 not present on the image, installing it'
          $installer = Join-Path $env:RUNNER_TEMP 'msys2-installer.exe'
          Invoke-WebRequest -Uri 'https://github.com/msys2/msys2-installer/releases/download/nightly-x86_64/msys2-x86_64-latest.exe' -OutFile $installer
          $root = "$env:RUNNER_TEMP\msys64"
          Start-Process -FilePath $installer -Wait -ArgumentList @(
            'in', '--confirm-command', '--accept-messages', '--root', ($root -replace '\\', '/')
          )
          if (-not (Test-Path (Join-Path $root 'usr\bin\bash.exe'))) { throw 'MSYS2 installation failed' }
          "MSYS2_ROOT=$root" >> $env:GITHUB_ENV

      - name: Build, validate and package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bash = Join-Path $env:MSYS2_ROOT 'usr\bin\bash.exe'
          $root = ($PWD.Path -replace '\\', '/')
          & $bash -lc "bash '$root/build/mingw/ci-opencv.sh' '$root/opencv' '$root' '$root/staging' '$root/dist' '${{ inputs.modules }}'"
          if ($LASTEXITCODE -ne 0) { throw "build failed with exit code $LASTEXITCODE" }
          Get-ChildItem dist | Select-Object Name, Length

      - name: Publish to the artifacts branch
        if: ${{ inputs.publish == true }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $info  = Get-Content 'dist\BUILDINFO.json' -Raw | ConvertFrom-Json
          $token = '${{ github.token }}'
          $repo  = '${{ github.repository }}'
          $dest  = "$($info.package)/$($info.version)/$($info.platform)"

          $checkout = Join-Path $env:RUNNER_TEMP 'artifacts-repo'
          if (Test-Path $checkout) { Remove-Item -LiteralPath $checkout -Recurse -Force }
          git clone --quiet --branch artifacts "https://x-access-token:$token@github.com/$repo.git" $checkout

          $target = Join-Path $checkout ($dest -replace '/', '\')
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item 'dist\*' $target -Force

          # Regenerate manifest.json and README.md from every package on the
          # branch - <package>/<version>/<platform> - so one package's build
          # never drops another's entry.
          $packages = @()
          foreach ($file in Get-ChildItem -Path $checkout -Recurse -Filter 'BUILDINFO.json' -ErrorAction SilentlyContinue) {
            $rel = $file.Directory.FullName.Substring($checkout.Length + 1) -replace '\\', '/'
            if (($rel -split '/').Count -ne 3) { continue }
            $pkg = Get-Content $file.FullName -Raw | ConvertFrom-Json
            $packages += [pscustomobject]@{
              package = $pkg.package; version = $pkg.version; platform = $pkg.platform
              toolchain = $pkg.toolchain; built_utc = $pkg.built_utc
              subtree_tree = $pkg.subtree_tree; source_commit = $pkg.source_commit
              source_ref = $pkg.source_ref; path = $rel
              modules = $pkg.modules; dependencies = $pkg.dependencies
            }
          }
          $packages = @($packages | Sort-Object package, version, platform)
          $manifest = @{ packages = @($packages) } | ConvertTo-Json -Depth 6
          [IO.File]::WriteAllText((Join-Path $checkout 'manifest.json'), ($manifest + "`n"))

          $rows = @()
          foreach ($p in $packages) { $rows += "| $($p.package) | $($p.version) | $($p.platform) | $($p.modules) | $($p.toolchain) | $($p.built_utc) |" }
          $readme = @(
            '# Build artifacts',
            '',
            'Prebuilt dependencies produced by CI. Consumers download these so they',
            'need neither cmake nor a toolchain of their own.',
            '',
            '| Package | Version | Platform | Modules | Toolchain | Built (UTC) |',
            '|---|---|---|---|---|---|'
          ) + $rows + @(
            '',
            '## How to consume',
            '',
            '```sh',
            'git fetch origin artifacts',
            'git show origin/artifacts:manifest.json',
            'git archive --remote=origin artifacts opencv/4.14.0/win-x64 | tar -x',
            '```',
            '',
            'Pin the commit of this branch, not the branch name, for a reproducible',
            'build. Each BUILDINFO.json records the toolchain, the subtree tree hash',
            'and the exact module list the package was built from.',
            ''
          )
          [IO.File]::WriteAllText((Join-Path $checkout 'README.md'), ($readme -join "`n"))

          Push-Location $checkout
          try {
            git config user.name  'GitHub Actions'
            git config user.email 'actions@github.com'
            git add -A
            git diff --cached --quiet
            if ($LASTEXITCODE -eq 0) {
              Write-Host 'artifacts branch already up to date'
            } else {
              $tree = "$($info.subtree_tree)"
              $sha = $tree.Substring(0, [Math]::Min(12, $tree.Length))
              git commit --quiet -m "$($info.package) $($info.version) $($info.platform) (subtree $sha)"
              git push --quiet origin HEAD:artifacts
              Write-Host "published $($info.package) $($info.version) to $dest"
            }
          } finally {
            Pop-Location
          }

      - name: Summary
        shell: pwsh
        run: |
          $info = Get-Content 'dist\BUILDINFO.json' -Raw | ConvertFrom-Json
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "OpenCV $($info.version)$($info.status) (suffix $($info.library_suffix)), modules: $($info.modules)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ''
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Toolchain: $($info.toolchain)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Subtree tree: $($info.subtree_tree)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Source commit: $($info.source_commit) ($($info.source_ref))"

  # The WASM package is built by a separate reusable workflow that runs on
  # ubuntu: the target is wasm32, so the host OS is irrelevant, and emscripten is
  # far better supported on Linux than under MSYS2. Called from here so the
  # Windows run produces both the native and the browser artifact.
  wasm:
    needs: build-and-publish
    if: ${{ inputs.wasm }}
    uses: ./.github/workflows/build-opencv-wasm.yml
    with:
      source_ref: ${{ inputs.source_ref }}
      modules: ${{ inputs.modules }}
      simd: ${{ inputs.wasm_simd }}
      publish: ${{ inputs.publish }}
